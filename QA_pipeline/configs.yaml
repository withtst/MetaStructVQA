# MetaStructVQA Pipeline Configuration
# All paths are relative to the project root (repo/), or use absolute paths

LLM: "deepseek-reasoner"

# Report language: "chinese" or "english"
# Affects question template language, LLM prompt language, and which report file to read
report_language: "chinese"

# Pre-processed folder after data fusion (generated by main_merger.py)
pre_version_folder: "VQA_pre_version"

# Output directory for filtered annotation files
output_folder: "MetaStructVQA_Dataset/annotations"

# Entity name Chinese-English mapping table
entities_mapping_table: "entities_nonsub_mapping_table.json"

# NER results folder (generated by deepseekNER module)
NER_folder: "deepseekNER/descriptions"
